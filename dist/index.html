a, Bengaluru.",getDirections:"Get Directions",openMaps:"Open Maps",mainChurch:"Main Church",sundayVenue:"Sunday Venue",hosaRoadBranch:"Hosa Road Branch",annPrayer:"🙏 Prayer Night",annYouth:"⚡ Youth Alive",annWomen:"🌸 Women of Faith",annRevival:"🔥 Revival Fire",annChristmas:"🎄 Christmas",minHealingName:"Healing Service",minHealingDesc:"Our Lord is a miracle-working God. Every Sunday a dedicated healing meeting is held where many receive miracles.",minHealingTime:"⏰ Every Sunday · 7:30 PM",minFastingName:"Fasting Prayer",minFastingDesc:"Fasting prayer to help people overcome barriers. As Esther's story shows — prayer can break any barrier.",minFastingTime:"⏰ Every Saturday · 10 AM – 12 PM",minBibleName:"Bible Study",minBibleDesc:"Well-trained and certified scholars teach the truth on Google Meet. We help people think, question, and grow.",minBibleTime:"⏰ Every Wednesday · 7 PM (Online)",minKidsName:"Kids Bible Club",minKidsDesc:"Fun-filled program with games, puppet shows, fancy dress competitions, and moral value teaching for children.",minKidsTime:"⏰ Every Sunday · 5 PM",minTeensName:"Teens Fellowship",minTeensDesc:"Equipping teens to face spiritual, school, and life challenges with trained professional spiritual teachers.",minTeensTime:"⏰ Every Saturday · 7 PM",minYouthName:"Youth Fellowship",minYouthDesc:"Fun-filled activities, mentorship, and Bible teaching to help youth overcome everyday life barriers.",minYouthTime:"⏰ Every Saturday · 7 PM",minWomenName:"Women's Fellowship",minWomenDesc:"A safe space for women to vent, support each other spiritually, and uphold one another in prayer.",minWomenTime:"⏰ Regular Gatherings",minPromiseName:"Promise Prayers",minPromiseDesc:"Begin each month in God's presence. The promise word of the month is shared through the man of God.",minPromiseTime:"⏰ Every Month 1st Day · 5 AM"},ta:{welcomesYou:"உங்களை வரவேற்கிறது",changeLangToast:"மெனுவிலிருந்து மொழியை எப்போது வேண்டுமானாலும் மாற்றலாம்.",navHome:"முகப்பு",navAnnouncements:"அறி n. A bondservant doesn't live in the house forever. A son remains forever. If therefore the Son makes you free, you will be free indeed."`,reflection:"Sin enslaves, but Jesus offers true freedom. Lasting deliverance begins through His transforming power."},{reference:"James 1:13-15",verse:`Let no man say when he is tempted, "I am tempted by God," for God can't be tempted by evil, and he himself tempts no one. But each one is tempted when he is drawn away by his own lust and enticed. Then the lust, when it has conceived, bears sin; and the sin, when it is full grown, produces death.`,reflection:"Addiction often begins with unchecked temptation. God calls believers to recognize its progression and seek His help before sin takes root."},{reference:"Proverbs 14:12",verse:"There is a way which seems right to a man, but in the end it leads to death.",reflection:"What feels right is not always God's way. Wisdom seeks God's direction rather than personal desires."}],adultery:[{reference:"Matthew 5:27-28",verse:`"You have heard that it was said, 'You shall not commit adultery;' but I tell you that everyone who gazes a woman to lust after her has committed adultery with her already in his heart."`,reflection:"Jesus teaches that purity begins in the heart. Faithfulness involves both outward actions and inward thoughts."},{reference:"Matthew 5:31-32",verse:`"It was also said, 'Whoever shall put away his wife, let him give her a writing of divorce,' but I tell you that whoever puts away his wife, except for the cause of sexual immorality, makes her an adulteress; and whoever marries her when she is put away commits adultery."`,reflection:"Marriage is a sacred covenant before God. Jesus emphasizes commitment, faithfulness, and the seriousness of breaking that covenant."},{reference:"1 Corinthians 6:18",verse:"Flee sexual immorality! Every sin that a man does is outside the body, but he who commits sexual immorality sins against his own body.",reflection:"God's instruction is not merely to resist but to flee temptation. Obedience protects both our bodies and our relationship with Him."}],adversity:[{reference:"Philippians 4:6-7",verse:"In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God. The peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Christ Jesus.",reflection:"Difficult circumstances are opportunities to pray rather than panic. God's peace guards believers even when answers are not immediate."},{reference:"1 Peter 1:6-7",verse:"Wherein you greatly rejoice, though now for a little while, if need be, you have been grieved in various trials, that the proof of your faith, being more precious than gold that perishes though it is tested by fire, may be found to result in praise, glory, and honor at the revelation of Jesus Christ.",reflection:"Trials refine faith like fire refines gold. God uses adversity to produce endurance and spiritual maturity."},{reference:"James 1:2-5",verse:"Count it all joy, my brothers, when you fall into various temptations, knowing that the testing of your faith produces perseverance. Let perseverance finish its work, that you may be perfect and complete, lacking in nothing. But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach; and it will be given to him.",reflection:"God can use hardship to build perseverance and wisdom. He faithfully gives wisdom to those who ask Him."}],anxiety:[{reference:"Matthew 6:25",verse:`"Therefore I tell you, don't be anxious for your life: what you will eat, or what you will drink; nor yet for your body, what you will wear. Isn't life more than food, and the body more than clothing?"`,reflection:"Jesus redirects our attention from worrying about daily needs to trusting our heavenly Father, who knows what we need."},{reference:"Matthew 6:31-33",verse:`"Therefore don't be anxious, saying, 'What will we eat?', 'What will we drink?' or, 'With what will we be clothed?' For the Gentiles seek after all these things, for your heavenly Father knows that you need all these things. But seek first God's Kingdom and his righteousness, and all these things will be given to you as well."`,reflection:"Our priority is God's kingdom. As we seek Him first, we learn to trust His faithful provision for our needs."},{reference:"Proverbs 12:25",verse:"Anxiety in a man's heart weighs it down, but a kind word makes it glad.",reflection:"Anxiety is heavy, but encouragement brings hope. God often comforts us through His Word and through caring people."}],away_from_god:[{reference:"1 John 1:8-10",verse:"If we say that we have no sin, we deceive ourselves, and the truth is not in us. If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness. If we say that we haven't sinned, we make him a liar, and his word is not in us.",reflection:"Restoration begins with honesty before God. He faithfully forgives and cleanses those who confess their sins."},{reference:"Psalm 51:1,10",verse:"Have mercy on me, God, according to your loving kindness. According to the multitude of your tender mercies, blot out my transgressions... Create in me a clean heart, O God. Renew a right spirit within me.",reflection:"God welcomes a repentant heart. He not only forgives but renews and restores those who seek Him."}],depressed:[{reference:"Psalm 34:4",verse:"I sought Yahweh, and he answered me, and delivered me from all my fears.",reflection:"God hears those who seek Him. Even in emotional darkness, He remains near and brings deliverance."},{reference:"Psalm 40:1-2",verse:"I waited patiently for Yahweh. He turned to me, and heard my cry. He also brought me up out of a horrible pit, out of the miry clay. He set my feet on a rock, and gave me a firm place to stand.",reflection:"God lifts people from despair and gives them stability. Waiting on Him is never wasted."},{reference:"Psalm 43:5",verse:"Why are you in despair, my soul? Why are you disturbed within me? Hope in God! For I shall still praise him, my Savior, my helper, and my God.",reflection:"When emotions are overwhelming, hope in God provides strength. Praise helps redirect our hearts toward His faithfulness."}],failure:[{reference:"Romans 8:31-39",verse:"What then shall we say about these things? If God is for us, who can be against us?... Who shall separate us from Christ's love?... For I am persuaded that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other created thing, will be able to separate us from God's love which is in Christ Jesus our Lord.",reflection:"Failure does not separate believers from God's love. Through Christ, we remain secure in His grace and victorious in Him."}],fear:[{reference:"2 Timothy 1:7",verse:"For God didn't give us a spirit of fear, but of power, love, and self-control.",reflection:"Fear is not the spirit God gives His children. He equips believers with courage, love, and sound judgment."},{reference:"Psalm 31:24",verse:"Be strong, and let your heart take courage, all you who hope in Yahweh.",reflection:"Hope in the Lord produces courage. God's promises strengthen the heart during uncertain times."},{reference:"Psalm 91:10",verse:"No evil shall happen to you, neither shall any plague come near your dwelling.",reflection:"God is our refuge and protector. This verse reminds believers to rest confidently under His care."},{reference:"Psalm 121:1-2",verse:"I will lift up my eyes to the hills. Where does my help come from? My help comes from Yahweh, who made heaven and earth.",reflection:"Our help comes from the Creator of heaven and earth. Looking to Him replaces fear with confidence and hope."}],forgiveness:[{reference:"John 3:16-18",verse:"For God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life. For God didn't send his Son into the world to judge the world, but that the world should be saved through him. He who believes in him is not judged. He who doesn't believe has been judged already, because he has not believed in the name of the one and only Son of God.",reflection:"God's forgiveness is rooted in His love and made possible through Jesus Christ. Everyone who believes in Him receives eternal life and freedom from condemnation."},{reference:"1 John 1:9",verse:"If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness.",reflection:"Confession is met with God's faithfulness. He not only forgives but also cleanses us, restoring our fellowship with Him."}],friends_fail:[{reference:"Luke 17:3-4",verse:"Be careful. If your brother sins against you, rebuke him. If he repents, forgive him. If he sins against you seven times in the day, and seven times returns, saying, 'I repent,' you shall forgive him.",reflection:"Relationships are strengthened by both truth and forgiveness. God calls us to extend grace as He has extended grace to us."},{reference:"Proverbs 18:24",verse:"A man of many companions may be ruined, but there is a friend who sticks closer than a brother.",reflection:"Human friendships may disappoint, but faithful friendship reflects God's steadfast love. Ultimately, Christ is the friend who never leaves us."}],future:[{reference:"Matthew 6:25, 33-34",verse:`"Therefore I tell you, don't be anxious for your life... But seek first God's Kingdom and his righteousness, and all these things will be given to you as well. Therefore don't be anxious for tomorrow, for tomorrow will be anxious for itself. Each day's own evil is sufficient."`,reflection:"The future belongs to God. Instead of worrying about tomorrow, believers are called to seek His kingdom and trust His daily provision."},{reference:"James 4:13-15",verse:"Come now, you who say, 'Today or tomorrow let's go into this city, and spend a year there, trade, and make a profit.' Whereas you don't know what your life will be like tomorrow. For what is your life? For you are a vapor that appears for a little time, and then vanishes away. Instead, you ought to say, 'If the Lord wills, we will both live, and do this or that.'",reflection:"Wise planning is always accompanied by humble dependence on God's will. Every future plan should be surrendered to Him."}],pain_sickness:[{reference:"2 Corinthians 12:9",verse:'He has said to me, "My grace is sufficient for you, for my power is made perfect in weakness." Most gladly therefore I will rather glory in my weaknesses, that the power of Christ may rest on me.',reflection:"God's grace is enough in every weakness. Even when healing does not come immediately, His strength sustains His people."},{reference:"James 5:14-15",verse:"Is any among you sick? Let him call for the elders of the assembly, and let them pray over him, anointing him with oil in the name of the Lord, and the prayer of faith will heal him who is sick, and the Lord will raise him up. If he has committed sins, it will be forgiven him.",reflection:"God invites His people to seek prayer during illness. Healing is entrusted to His wisdom and compassionate care."},{reference:"Psalm 103:2-4",verse:"Praise Yahweh, my soul, and don't forget all his benefits, who forgives all your sins, who heals all your diseases, who redeems your life from destruction, who crowns you with loving kindness and tender mercies.",reflection:"God is both Redeemer and Healer. His blessings include forgiveness, restoration, and steadfast love."}],peace:[{reference:"John 14:1-4",verse:`"Don't let your heart be troubled. Believe in God. Believe also in me. In my Father's house are many homes... I am going to prepare a place for you... I will come again and will receive you to myself, that where I am, you may be there also. Where I go, you know, and you know the way."`,reflection:"Jesus offers lasting peace by assuring believers of their eternal home with Him. His promises calm troubled hearts."},{reference:"John 14:27",verse:`"Peace I leave with you. My peace I give to you; not as the world gives, give I to you. Don't let your heart be troubled, neither let it be fearful."`,reflection:"Christ's peace is different from the world's temporary comfort. His peace remains even in the midst of uncertainty."}],peer_pressure:[{reference:"1 Corinthians 15:33",verse:"Don't be deceived! 'Evil companionships corrupt good morals.'",reflection:"The people we spend time with influence our thoughts, values, and actions. Choosing godly companions helps us remain faithful to Christ."},{reference:"Psalm 1:1-2",verse:"Blessed is the man who doesn't walk in the counsel of the wicked, nor stand on the path of sinners, nor sit in the seat of scoffers; but his delight is in Yahweh's law. On his law he meditates day and night.",reflection:"A blessed life begins by resisting ungodly influences and delighting in God's Word. Scripture provides wisdom to stand firm under pressure."},{reference:"Proverbs 1:10-15",verse:"My son, if sinners entice you, don't consent. If they say, 'Come with us... let's all have one purse'... my son, don't walk on the path with them. Keep your foot from their path.",reflection:"God encourages His people to reject invitations that lead toward sin. True wisdom often requires the courage to say no."}],relationships:[{reference:"1 Corinthians 15:33",verse:"Don't be deceived! 'Evil companionships corrupt good morals.'",reflection:"Healthy relationships encourage spiritual growth. Choosing friends wisely protects our faith and character."},{reference:"Proverbs 13:20",verse:"One who walks with wise men grows wise, but a companion of fools suffers harm.",reflection:"The company we keep shapes the direction of our lives. Surrounding ourselves with wise, godly people helps us grow in wisdom."},{reference:"Proverbs 18:24",verse:"A man of many companions may be ruined, but there is a friend who sticks closer than a brother.",reflection:"Faithful friendships are built on loyalty and love rather than popularity. God calls us to be the kind of friend who reflects His faithfulness."}],stress:[{reference:"Psalm 27:5",verse:"For in the day of trouble he will keep me secretly in his pavilion. In the secret place of his tabernacle he will hide me. He will lift me up on a rock.",reflection:"God is a safe refuge during life's pressures. His presence provides security when circumstances feel overwhelming."},{reference:"Psalm 30:5",verse:"For his anger is but for a moment. His favor is for a lifetime. Weeping may stay for the night, but joy comes in the morning.",reflection:"Seasons of sorrow do not last forever. God's favor and hope bring renewed joy after difficult times."},{reference:"Psalm 37:7-8",verse:"Rest in Yahweh, and wait patiently for him. Don't fret because of him who prospers in his way, because of the man who makes wicked plots happen. Cease from anger, and forsake wrath. Don't fret; it leads only to evildoing.",reflection:"Stress often grows when we compare ourselves to others or try to control what we cannot. God invites us to rest patiently in Him and trust His timing."}],temptation:[{reference:"2 Timothy 2:22",verse:"Flee youthful lusts, and pursue righteousness, faith, love, and peace with those who call on the Lord out of a pure heart.",reflection:"Victory over temptation is found not only by fleeing sin but by actively pursuing righteousness. God calls believers to seek holy relationships and a life that honors Him."}]},$1=[{key:"anxiety",label:"Anxiety & Worry",emoji:"😰",group:"comfort"},{key:"depressed",label:"Depression / Downcast",emoji:"😢",group:"comfort"},{key:"pain_sickness",label:"Sickness & Pain",emoji:"🤒",group:"comfort"},{key:"fear",label:"Fear & Courage",emoji:"😨",group:"comfort"},{key:"stress",label:"Stress & Pressure",emoji:"🤯",group:"comfort"},{key:"failure",label:"Experiencing Failure",emoji:"❌",group:"comfort"},{key:"temptation"
