்",navAbout:"எங்களை பற்றி",navMinistries:"ஊழியங்கள்",navDailyManna:"தினசரி மன்னா",navContact:"தொடர்பு",heroWelcome:"சீயோன் ஏஜி சபைக்கு வரவேற்கிறோம்",heroTitle:"தேவ பிரசன்னத்தை உணருங்கள்.",heroDesc:"விசுவாசம், குடும்பம் மற்றும் ஆராதனையின் மாற்றும் வல்லமையை அனுபவிக்க இந்த ஞாயிற்றுக்கிழமை எங்களுடன் இணையுங்கள்.",joinSunday:"இந்த ஞாயிறு வாருங்கள்",watchLive:"நேரலையில் காணுங்கள்",aboutTitle:"எங்கள் சபையைப் பற்றி",aboutP1:"சீயோன் ஏஜி சபை மடிவாளா, மாருதி நகர் மெயின் ரோட்டில் அமைந்துள்ளது — பிடிஎம் லேஅவுட், கோரமங்களா, எச்எஸ்ஆர் லேஅவுட், எலக்ட்ரானிக் சிட்டி மற்றும் பன்னேர்கட்டா ரோட்டிலிருந்து எளிதில் அணுகலாம்.",aboutP2:"உங்கள் ஆத்துமாவின் இரட்சகரை சந்திப்பதற்கான உங்கள் புனித இடம் சீயோன் ஏஜி சபை. திறந்த இருதயத்துடன் வாருங்கள் — அவர் தரும் சமாதானம், சந்தோஷம், பலம் மற்றும் மாற்றத்தை வார்த்தைகளால் விவரிப்பதை விட அனுபவிப்பதே மேல்.",aboutBanner:"📅 ஞாயிறு ஆராதனைகள் மட்டுமின்றி இணைந்திருங்கள்! எங்கள் செய்திகள் மற்றும் நிகழ்வுகளைப் பாருங்கள்.",aboutQuote:'"எங்களுடன் இணைந்து, கடவுளின் அன்பிலும் நோக்கத்திலும் வாழ்வதன் உண்மையான அர்த்தத்தைக் கண்டறியுங்கள்!"',pastorName:"ரெவ. பாஸ்டர் டேவிட் பால்",pastorTitle:"மூத்த போதகர் · சீயோன் ஏஜி சபை, மடிவாளா",pastorDesc:"சதர்ன் ஆசியா பைபிள் கல்லூரியில் பட்டம் பெற்றவர். போதகர் டேவிட் மற்றும் அவரது மனைவி போதகர் ஷீபா, தங்கள் இரு குழந்தைகளுடன் பெங்களூரு மடிவாளா பகுதியில் தேவனுக்காக ஊழியம் செய்கிறார்கள்.",stayUpdated:"✦ இணைந்திருங்கள் ✦",announcementsTitle:"அறிவிப்புகள்",growWithUs:"✦ எங்களுடன் வளருங்கள் ✦",ministriesTitle:"எங்கள் ஊழியங்கள்",promisePrayers:"வாக்குத்தத்த ஜெபங்கள்",promiseDesc:"ஒவ்வொரு மாதத்தையும் தேவ சமூகத்தில் தொடங்குங்கள். ஒவ்வொரு மாதமும் 1 ஆம் தேதி காலை 5 மணிக்கு தேவ மனிதர் மூலம் மாதத்தின் வாக்குத்தத்த வார்த்தை பகிரப்படுகிறது.",addToCalendar:"🗓 உங்கள் காலண்டரில் சேர்க்கவும்",dailyMannaTitle:"இன்றைய வார்த்தை",reflection:"சிந்தனை",newVerse:"புதிய வசனம் ↻",connectWithUs:"எங்களை தொடர்பு கொள்ள",contactTitle:"சந்திக்க, அழைக்க அல்லது ஜெப குறிப்பை அனுப்ப",contactDesc:"உங்கள் வருகையை திட்டமிடவும், ஜெப குறிப்புகளைப் பெறவும், உங்களை சரியான ஊழியத்த
